<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>J.A.R.V.I.S</title>
<style>
*{margin:0;padding:0;box-sizing:border-box} body{background:#000;color:#00ffff;font-family:monospace;text-align:center;overflow-x:hidden}
header{padding:15px;font-size:18px;letter-spacing:2px;border-bottom:1px solid #0ff3}
.core{position:relative;width:260px;height:260px;margin:30px auto}
.ring{position:absolute;top:0;left:0;width:100%;height:100%;border:2px solid transparent;border-radius:50%}
.r1{border-top:2px solid #0ff;border-left:2px solid #0ff3;animation:spin 3s linear infinite}
.r2{width:80%;height:80%;top:10%;left:10%;border-right:2px solid #0ff;border-bottom:2px solid #0ff3;animation:spin 2s linear infinite reverse}
.r3{width:55%;height:55%;top:22.5%;left:22.5%;border-bottom:2px solid #0ff;animation:spin 1.5s linear infinite}
.center{position:absolute;width:45%;height:45%;top:27.5%;left:27.5%;background:#0ff;border-radius:50%;box-shadow:0 0 40px #0ff,0 0 80px #0ff}
@keyframes spin{100%{transform:rotate(360deg)}}
.core-text{color:#0ff;letter-spacing:3px;margin-top:10px}
.status{margin-top:15px;line-height:22px;font-size:14px}
.status b.on{color:#0f0} .status b.off{color:#555}
.chat{width:92%;max-width:500px;height:38vh;margin:20px auto;border:1px solid #0ff4;text-align:left;padding:10px;overflow-y:auto;background:#001111}
.input-area{display:flex;width:92%;max-width:500px;margin:0 auto;gap:6px}
#user-input{flex:1;background:#000;border:1px solid #0ff;color:#0ff;padding:12px}
button{background:#0ff;color:#000;border:none;padding:12px 15px;font-weight:bold}
#api-box{width:92%;max-width:500px;margin:10px auto;display:flex;gap:6px}
#api-input{flex:1;background:#000;border:1px solid #0ff;color:#0ff;padding:10px;font-size:12px}
</style></head><body>
<header>J.A.R.V.I.S // MOBILE EDITION</header>
<div class="core"><div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div><div class="center"></div></div>
<div class="core-text">CORE ACTIVE</div>
<div class="status">SYSTEM STATUS<br>AI CORE: <b class="on">ONLINE</b><br>NETWORK: <b class="on">ONLINE</b><br>VOICE: <b class="on" id="v-stat">OFFLINE</b><br>MEMORY: <b class="off">OFF</b></div>
<div class="chat" id="chat"></div>
<div class="input-area"><input id="user-input" placeholder="Ask J.A.R.V.I.S..."><button id="send">SEND</button><button id="mic">🎤</button></div>
<div id="api-box"><input id="api-input" type="text" placeholder="AIza... wali Google Key yaha paste karo"><button onclick="saveKey()">save</button></div>
<script>
const chat=document.getElementById('chat'), input=document.getElementById('user-input'), mic=document.getElementById('mic'), send=document.getElementById('send');
function saveKey(){localStorage.setItem('jarvis_key',document.getElementById('api-input').value.trim()); chat.innerHTML+=`<div>Key Save Ho Gayi</div>`}
async function ask(){
 let q=input.value.trim(); if(!q) return; chat.innerHTML+=`<div>YOU: ${q}</div>`; input.value=''; chat.scrollTop=9999;
 let key=localStorage.getItem('jarvis_key'); if(!key){chat.innerHTML+=`<div>JARVIS: Pehle Sahi API Key Daalo</div>`;return}
 try{
  let res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:q}]}]})});
  let data=await res.json(); console.log(data);
  if(data.error){chat.innerHTML+=`<div>JARVIS Error: ${data.error.message}</div>`; return}
  let ans=data.candidates?.[0]?.content?.parts?.[0]?.text || 'No Reply - Key check karo';
  chat.innerHTML+=`<div>JARVIS: ${ans}</div>`; chat.scrollTop=9999;
 }catch(e){chat.innerHTML+=`<div>Error: ${e.message}</div>`}
}
send.onclick=ask; input.onkeypress=e=>{if(e.key==='Enter')ask()};
if(mic){
 mic.onclick=()=>{
  let SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){chat.innerHTML+=`<div>Mic support nahi hai</div>`;return}
  let rec=new SR(); rec.lang='hi-IN'; rec.start();
  document.getElementById('v-stat').innerText='LISTENING'; document.getElementById('v-stat').className='on';
  rec.onresult=e=>{input.value=e.results[0][0].transcript; ask()};
  rec.onend=()=>{document.getElementById('v-stat').innerText='OFFLINE'; document.getElementById('v-stat').className='off'};
  rec.onerror=e=>{chat.innerHTML+=`<div>Mic Error: ${e.error} - https par kholo</div>`}
 }
}
</script></body></html>
